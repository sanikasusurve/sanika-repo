<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website with Navbar</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #dab7aa;
        }

        header {
            background-color: #121213;
            color: white;
            padding: 10px 0;
            text-align: center;
        }

        /* Navbar styles */
        nav {
            display: flex;
            justify-content: center;
            background-color: #444;
            padding: 10px;
        }

        nav a {
            color: rgb(255, 255, 255);
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 15px;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #666;
        }

        /* Sections styling */
        section {
            padding: 50px;
            text-align: center;
            margin: 20px;
            border-radius: 5px;
        }

        .home {
            background-color: #d37d7d;
        }

        .gallery {
            background-color: #d38080;
        }

        .contact {
            background-color: #d88080;
        }

        .about {
            background-color: #da7676;
        }

        /* Footer Styling */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Welcome to Our Website</h1>
    </header>

    <!-- Navbar -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        
    </nav>

    <!-- Sections -->
    <section id="home" class="home">
        <h2>Home</h2>
        <p>Welcome to our home page! Explore different sections of our website through the navbar above.</p>
    </section>

    
    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Your Website. All rights reserved.</p>
    </footer>

</body>
</html>
